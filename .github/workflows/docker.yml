name: Build and Publish Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name and UI version
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Spacelanes Proxy
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: spacelanes-proxy:smoke
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        shell: bash
        run: |
          docker run --detach --name spacelanes-smoke \
            --publish 127.0.0.1:8080:8080 spacelanes-proxy:smoke
          trap 'docker logs spacelanes-smoke; docker rm --force spacelanes-smoke' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors \
            --retry-connrefused --output /tmp/spacelanes.html http://127.0.0.1:8080/
          grep -q '<title>Spacelanes Proxy</title>' /tmp/spacelanes.html
          grep -q '<div id="root">' /tmp/spacelanes.html
          test "$(docker exec spacelanes-smoke id -u)" -ne 0
          docker exec spacelanes-smoke wget --quiet --spider http://127.0.0.1:8080/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image details
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          printf 'Published Spacelanes Proxy images:\n\n```text\n%s\n```\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
